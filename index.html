<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OttoMeet Stage</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/MicrosoftTeams.min.js"></script>
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <!-- Side Panel: nur Starter für die Bühne -->
    <section id="launcher" class="card" hidden>
      <div class="eyebrow">Meeting Stage</div>
      <h1>OttoMeet Stage</h1>
      <p class="hint">Zeigt „I Consent“ und „Open OttoMeet“ groß auf der Meeting-Bühne für alle Teilnehmer an.</p>
      <button id="shareStage" class="stage" type="button">Auf Meeting-Bühne anzeigen</button>
      <p id="launcherStatus" class="status" aria-live="polite"></p>
    </section>

    <!-- Bühnenansicht -->
    <section id="stageView" class="card" hidden>
      <div class="eyebrow">Microsoft Teams</div>
      <h1 id="title">OttoMeet</h1>
      <p id="subtitle"></p>

      <div class="actions">
        <button id="consentButton" class="primary" type="button">I Consent</button>
        <button id="ottomeetButton" class="secondary" type="button">Open OttoMeet</button>
      </div>
      <p class="hint consent-hint">„I Consent“ öffnet die OttoMeet-Einwilligung im Browser – nur für dich, mit deinem Microsoft-Konto.</p>

      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
